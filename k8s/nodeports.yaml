# Expose the Temporal frontend and Web UI on the kind node; kind/cluster.yaml
# forwards these NodePorts to 127.0.0.1:7233 and 127.0.0.1:8080 on the host.
# Selectors use the labels set by the official Helm chart (release name "temporal").
apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend-nodeport
  namespace: temporal
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: temporal
    app.kubernetes.io/component: frontend
  ports:
    - {name: grpc-rpc, port: 7233, targetPort: 7233, nodePort: 30233}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-web-nodeport
  namespace: temporal
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: temporal
    app.kubernetes.io/instance: temporal
    app.kubernetes.io/component: web
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30880}
